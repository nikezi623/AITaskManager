<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is REQUIRED: without it every env(safe-area-inset-*)
     resolves to 0 and the layout runs under the notch and home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default", not "black-translucent": this is a light-themed app, and
     black-translucent would draw white status-bar text on a near-white
     background, hiding the clock and battery. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="习惯打卡">
<meta name="theme-color" content="#f0f2f5">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<title>ATM · 习惯打卡</title>
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app" class="app"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
